<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Français Coach</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#121212;
    color:#fff;
    margin:0;
    padding:20px;
    max-width:800px;
    margin:auto;
}

h1,h2{
    text-align:center;
}

.card{
    background:#1e1e1e;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
}

button:hover{
    background:#1d4ed8;
}

input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    margin-top:10px;
    box-sizing:border-box;
}

.frase{
    font-size:1.5rem;
    text-align:center;
    margin:20px 0;
}

.correcto{
    color:#22c55e;
    font-weight:bold;
}

.incorrecto{
    color:#ef4444;
    font-weight:bold;
}

.racha{
    text-align:center;
    color:#facc15;
    font-size:1.2rem;
}

#zonaTest button{
    width:100%;
    display:block;
    margin-bottom:10px;
}
</style>
</head>

<nav>

    <button onclick="mostrarPantalla('aprender')">
        📚
    </button>

    <button onclick="mostrarPantalla('flashcards')">
        🃏
    </button>

</nav>
    
<body>

<div id="pantallaAprender">   
    
<h1>🇫🇷 Français Coach</h1>

<div class="card">
    <div class="racha">
        🔥 Racha:
        <span id="racha">0</span>
        días
    </div>
</div>

<div class="card">
    <h2>Modo de aprendizaje</h2>

    <button onclick="cambiarModo('test')">
        ✅ Test
    </button>

    <button onclick="cambiarModo('escritura')">
        ✍️ Escritura
    </button>
</div>

<div class="card">

    <h2>Ejercicio</h2>

    <div id="pregunta" class="frase"></div>

    <button onclick="escucharFrances()">
        🔊 Escuchar
    </button>

    <div id="zonaTest"></div>

    <div id="zonaEscritura">

        <input
            type="text"
            id="respuesta"
            placeholder="Escribe la traducción">

        <button onclick="comprobar()">
            Comprobar
        </button>

    </div>

    <p id="resultado"></p>

</div>

<div class="card">
<h2>📊 Estadísticas</h2>

<p>Total respuestas:
<span id="totalRespuestas">0</span></p>

<p>Aciertos:
<span id="aciertos">0</span></p>

<p>Fallos:
<span id="fallos">0</span></p>

<p>% Éxito:
<span id="porcentaje">0</span>%</p>

</div>

<div class="card">

<h2>🏆 Progreso</h2>

<p>
Nivel:
<span id="nivel">1</span>
</p>

<p>
XP:
<span id="xp">0</span> /
<span id="xpMax">100</span>
</p>

<div style="
width:100%;
height:20px;
background:#333;
border-radius:10px;
overflow:hidden;">

<div id="barraXP"
style="
height:100%;
width:0%;
background:#22c55e;">
</div>

</div>

</div>

<div class="card">

<h2>🎖️ Logros</h2>

<div id="logros">
<p>Aún no hay logros.</p>
</div>

</div>

<script>

let modo="test";

const frases=[

{
id:1,
frances:"Bonjour",
espanol:"hola"
},

{
id:2,
frances:"Merci beaucoup",
espanol:"muchas gracias"
},

{
id:3,
frances:"Je vais au travail",
espanol:"voy al trabajo"
},

{
id:4,
frances:"Je suis fatigué",
espanol:"estoy cansado"
},

{
id:5,
frances:"Où est la gare ?",
espanol:"dónde está la estación"
},

{
id:6,
frances:"Je voudrais un café",
espanol:"quisiera un café"
},

{
id:7,
frances:"Comment allez-vous ?",
espanol:"cómo está usted"
},

{
id:8,
frances:"J'aime apprendre le français",
espanol:"me gusta aprender francés"
},

{
id:9,
frances:"Il fait beau aujourd'hui",
espanol:"hace buen tiempo hoy"
},

{
id:10,
frances:"Je parle un peu français",
espanol:"hablo un poco de francés"
}

];

let ejercicioActual = null;
let flashcardActual = null;

const estadisticas =
JSON.parse(
    localStorage.getItem("estadisticas")
)
||
{
    respuestas: 0,
    aciertos: 0,
    fallos: 0
};

function guardarEstadisticas(){

    localStorage.setItem(
        "estadisticas",
        JSON.stringify(estadisticas)
    );

}

function obtenerRepasos(){

    let datos =
    JSON.parse(
        localStorage.getItem("repasos")
    );

    if(!datos){

        datos = {};

        frases.forEach(f => {

            datos[f.id] = {
                aciertos: 0,
                fallos: 0,
                proximoRepaso: 0
            };

        });

        
function actualizarRepaso(correcto){

    const repasos =
    obtenerRepasos();

    if(correcto){

        repasos[
            ejercicioActual.id
        ].aciertos++;

        const nivel =

        repasos[
            ejercicioActual.id
        ].aciertos;

        repasos[
            ejercicioActual.id
        ].proximoRepaso =

        Date.now() +
        Math.min(30, nivel) *
        24 * 60 * 60 * 1000;

    }else{

        repasos[
            ejercicioActual.id
        ].fallos++;

        repasos[
            ejercicioActual.id
        ].proximoRepaso =

        Date.now() +
        24 * 60 * 60 * 1000;

    }

    guardarRepasos(repasos);

}

function responderTest(respuesta){

    const correcta =
    ejercicioActual.espanol;

    const resultado =
    document.getElementById(
        "resultado"
    );

    estadisticas.respuestas++;

    if(respuesta === correcta){

        estadisticas.aciertos++;

        actualizarRepaso(true);

        resultado.className =
        "correcto";

        resultado.textContent =
        "✅ Correcto";

    }else{

        estadisticas.fallos++;

        actualizarRepaso(false);

        resultado.className =
        "incorrecto";

        resultado.textContent =
        "❌ Correcto: " +
        correcta;

    }

    guardarEstadisticas();

    actualizarDashboard();

    setTimeout(
        seleccionarPendiente,
        1500
    );

}

function comprobar(){

    const texto =
    document
    .getElementById("respuesta")
    .value
    .trim()
    .toLowerCase();

    const correcta =
    ejercicioActual.espanol
    .toLowerCase();

    const resultado =
    document.getElementById(
        "resultado"
    );

    estadisticas.respuestas++;

    if(texto === correcta){

        estadisticas.aciertos++;

        actualizarRepaso(true);

        resultado.className =
        "correcto";

        resultado.textContent =
        "✅ Correcto";

    }else{

        estadisticas.fallos++;

        actualizarRepaso(false);

        resultado.className =
        "incorrecto";

        resultado.textContent =
        "❌ Correcto: " +
        ejercicioActual.espanol;

    }

    guardarEstadisticas();

    actualizarDashboard();

    setTimeout(
        seleccionarPendiente

function escucharFrances(){

    if(!ejercicioActual){
        return;
    }

    const voz =
        new SpeechSynthesisUtterance(
            ejercicioActual.frances
        );

    voz.lang = "fr-FR";

    speechSynthesis.cancel();
    speechSynthesis.speak(voz);

}

function mostrarPantalla(tipo){

    document.getElementById(
        "pantallaAprender"
    ).style.display =
        tipo === "aprender"
        ? "block"
        : "none";

    document.getElementById(
        "pantallaFlashcards"
    ).style.display =
        tipo === "flashcards"
        ? "block"
        : "none";

    if(tipo === "flashcards"){
        cargarFlashcard();
    }

}

function cargarFlashcard(){

    const repasos =
        obtenerRepasos();

    const ahora =
        Date.now();

    let pendientes =
        frases.filter(
            f => repasos[f.id].proximoRepaso <= ahora
        );

    if(pendientes.length === 0){
        pendientes = frases;
    }

    flashcardActual =
        pendientes[
            Math.floor(
                Math.random() *
                pendientes.length
            )
        ];

    document.getElementById(
        "flashFrances"
    ).textContent =
        flashcardActual.frances;

    document.getElementById(
        "flashEspanol"
    ).textContent =
        "???";

}

function mostrarRespuestaFlash(){

    if(!flashcardActual){
        return;
    }

    document.getElementById(
        "flashEspanol"
    ).textContent =
        flashcardActual.espanol;

}

function siguienteFlashcard(){

    cargarFlashcard();

}

function escucharFlashcard(){

    if(!flashcardActual){
        return;
    }

    const voz =
        new SpeechSynthesisUtterance(
            flashcardActual.frances
        );

    voz.lang = "fr-FR";

    speechSynthesis.cancel();
    speechSynthesis.speak(
        voz
    );

}

function marcarFlashcard(correcto){

    const repasos =
        obtenerRepasos();

    if(correcto){

        repasos[
            flashcardActual.id
        ].aciertos++;

        const aciertos =
            repasos[
                flashcardActual.id
            ].aciertos;

        repasos[
            flashcardActual.id
        ].proximoRepaso =
            Date.now() +
            Math.min(30, aciertos) *
            24 * 60 * 60 * 1000;

    }else{

        repasos[
            flashcardActual.id
        ].fallos++;

        repasos[
            flashcardActual.id
        ].proximoRepaso =
            Date.now() +
            24 * 60 * 60 * 1000;

    }

    guardarRepasos(repasos);

    setTimeout(
        cargarFlashcard,
        300
    );

}

actualizarDashboard();
actualizarRacha();
seleccionarPendiente();

</div>

<div id="pantallaFlashcards" style="display:none;">

    <div class="card">

        <h2>🃏 Flashcards</h2>

        <div id="flashInfo">
            Tarjeta de vocabulario
        </div>

        <div class="front" id="flashFrances">
            Bonjour
        </div>

        <div class="back" id="flashEspanol">
            ???
        </div>

        <button id="mostrarBtn"
                onclick="mostrarRespuestaFlash()">
            Mostrar respuesta
        </button>

        <div class="actions">

            <button onclick="escucharFlashcard()">
                🔊
            </button>

            <button onclick="siguienteFlashcard()">
                ➡️
            </button>

        </div>

        <div class="learn">

            <button class="bad"
                    onclick="marcarFlashcard(false)">
                😵 Difícil
            </button>

            <button class="good"
                    onclick="marcarFlashcard(true)">
                ✅ Fácil
            </button>

        </div>

    </div>

</div>
    
</script>

</body>
</html>
