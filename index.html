<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Français avec Gus</title>

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#0d6efd">

</head>

<body>

<header>

    <h1>🇫🇷 Français avec Gus</h1>

    <p id="contador"></p>

    <progress
        id="barraProgreso"
        value="0"
        max="100">
    </progress>

</header>

<main>

    <div class="filters">

        <select id="nivelFilter">

            <option value="Todos">
                Todos los niveles
            </option>

            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>

        </select>

    </div>

    <div class="stats">

        <div class="stat-box">
            <span id="aprendidas">0</span>
            <small>Aprendidas</small>
        </div>

        <div class="stat-box">
            <span id="dificiles">0</span>
            <small>Difíciles</small>
        </div>

        <div class="stat-box">
            <span id="total">0</span>
            <small>Total</small>
        </div>

    </div>

    <div class="card">

        <div id="info"></div>

        <div id="frances" class="front"></div>

        <div id="espanol" class="back"></div>

        <button id="mostrarBtn">
            Mostrar respuesta
        </button>

        <div class="actions">

            <button onclick="anterior()">
                ⬅
            </button>

            <button onclick="escuchar()">
                🔊
            </button>

            <button onclick="siguiente()">
                ➡
            </button>

        </div>

        <div class="learn">

            <button
                class="bad"
                onclick="marcarDificil()">

                ❌ No sabía

            </button>

            <button
                class="good"
                onclick="marcarFacil()">

                ✅ La sabía

            </button>

        </div>

    </div>

</main>

<nav>

    <button onclick="irInicio()">
        🏠
    </button>

    <button onclick="mostrarTodas()">
        📚
    </button>

    <button onclick="mostrarResumen()">
        📊
    </button>

    <button onclick="reiniciarProgreso()">
        🔄
    </button>

</nav>

<script src="app.js"></script>

</body>

</html>
