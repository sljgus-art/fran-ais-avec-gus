<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Français Coach</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#121212;
    color:#fff;
    margin:0;
    padding:20px;
    max-width:800px;
    margin:auto;
}

h1,h2{
    text-align:center;
}

.card{
    background:#1e1e1e;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
}

button:hover{
    background:#1d4ed8;
}

input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    margin-top:10px;
    box-sizing:border-box;
}

.frase{
    font-size:1.5rem;
    text-align:center;
    margin:20px 0;
}

.correcto{
    color:#22c55e;
    font-weight:bold;
}

.incorrecto{
    color:#ef4444;
    font-weight:bold;
}

.racha{
    text-align:center;
    color:#facc15;
    font-size:1.2rem;
}

#zonaTest button{
    width:100%;
    display:block;
    margin-bottom:10px;
}
</style>
</head>

<body>

<h1>🇫🇷 Français Coach</h1>

<div class="card">
    <div class="racha">
        🔥 Racha:
        <span id="racha">0</span>
        días
    </div>
</div>

<div class="card">
    <h2>Modo de aprendizaje</h2>

    <button onclick="cambiarModo('test')">
        ✅ Test
    </button>

    <button onclick="cambiarModo('escritura')">
        ✍️ Escritura
    </button>
</div>

<div class="card">

    <h2>Ejercicio</h2>

    <div id="pregunta" class="frase"></div>

    <button onclick="escucharFrances()">
        🔊 Escuchar
    </button>

    <div id="zonaTest"></div>

    <div id="zonaEscritura">

        <input
            type="text"
            id="respuesta"
            placeholder="Escribe la traducción">

        <button onclick="comprobar()">
            Comprobar
        </button>

    </div>

    <p id="resultado"></p>

</div>

<div class="card">
<h2>📊 Estadísticas</h2>

<p>Total respuestas:
<span id="totalRespuestas">0</span></p>

<p>Aciertos:
<span id="aciertos">0</span></p>

<p>Fallos:
<span id="fallos">0</span></p>

<p>% Éxito:
<span id="porcentaje">0</span>%</p>

</div>

<script>

const frases=[

frances:"Merci beaucoup",

},

{
id:3,
frances:"Je vais au travail",
espanol:"voy al trabajo"
},

{
id:4,
frances:"Je suis fatigué",
espanol:"estoy cansado"
},

{
id:5,
frances:"Où est la gare ?",
espanol:"dónde está la estación"
},

{
id:6,
frances:"Je voudrais un café",
espanol:"quisiera un café"
},

{
id:7,
frances:"Comment allez-vous ?",
espanol:"cómo está usted"
},

{

frances:"J'aime apprendre le français",
espanol:"me gusta aprender francés"
},

{

frances:"Il fait beau aujourd'hui",

},

{
id:10,
frances:"Je parle un peu français",
espanol:"hablo un poco de francés"
}

];

let ejercicioActual=null;

const estadisticas=
JSON.parse(
localStorage.getItem("estadisticas")
)
||
{
respuestas:0,
aciertos:0,
fallos:0
};

function guardarEstadisticas(){

localStorage.setItem(
"estadisticas",
JSON.stringify(estadisticas)
);

}

function obtenerRepasos(){

let datos=
JSON.parse(
localStorage.getItem("repasos")
);

if(!datos){

datos={};

frases.forEach(f=>{

datos[f.id]={
aciertos:0,
fallos:0,
proximoRepaso:0
};

});

guardarRepasos(datos);

}

return datos;

}

function guardarRepasos(datos){

localStorage.setItem(
"repasos",
JSON.stringify(datos)
);

}

function barajar(array){

for(let i=array.length-1;i>0;i--){

const j=
Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

function generarOpciones(frase){

const opciones=[
frase.espanol
];

while(opciones.length<4){

const candidata=

frases[
Math.floor(
Math.random()*frases.length
)
].espanol;

if(
!opciones.includes(
candidata
)
){
opciones.push(candidata);
}

}

return barajar(opciones);

}

function cambiarModo(nuevoModo){

modo=nuevoModo;

seleccionarPendiente();

}

function seleccionarPendiente(){

const repasos=
obtenerRepasos();

const ahora=
Date.now();

frases.filter(f=>
repasos[f.id].proximoRepaso<=ahora
);

if(
pendientes.length===0
){
pendientes=frases;
}

ejercicioActual=
pendientes[
Math.floor(
Math.random()*
pendientes.length
)
];

document.getElementById(
"pregunta"
).textContent=
ejercicioActual.frances;

document.getElementById(
"resultado"
).textContent="";

if(modo==="test"){

mostrarModoTest();

}else{

document.getElementById(
"zonaTest"
).innerHTML="";

document.getElementById(
"zonaEscritura"
).style.display="block";

document.getElementById(
"respuesta"
).value="";

}

}

function mostrarModoTest(){

document.getElementById(
"zonaEscritura"
).style.display="none";

const zona=
document.getElementById(
"zonaTest"
);

zona.innerHTML="";

const opciones=
generarOpciones(
ejercicioActual
);

opciones.forEach(opcion=>{

const btn=
document.createElement(
"button"
);

btn.textContent=
opcion;

btn.onclick=()=>{

responderTest(
opcion
);

};

zona.appendChild(btn);

});

}

function actualizarRepaso(correcto){

const repasos=
obtenerRepasos();

if(correcto){

repasos[
ejercicioActual.id
].aciertos++;

const nivel=

repasos[
ejercicioActual.id
].aciertos;

repasos[
ejercicioActual.id
].proximoRepaso=

Date.now()+
Math.min(30,nivel)*
24*60*60*1000;

}else{

repasos[
ejercicioActual.id
].fallos++;

repasos[
ejercicioActual.id
].proximoRepaso=

Date.now()+
24*60*60*1000;

}

guardarRepasos(repasos);

}

function responderTest(respuesta){

const correcta=
ejercicioActual.espanol;

estadisticas.respuestas++;

if(respuesta===correcta){

estadisticas.aciertos++;

actualizarRepaso(true);

resultado.className=
"correcto";

resultado.textContent=
"✅ Correcto";

}else{

estadisticas.fallos++;

actualizarRepaso(false);

resultado.className=
"incorrecto";

resultado.textContent=
"❌ Correcto: "+
correcta;

}

guardarEstadisticas();

actualizarDashboard();

setTimeout(
seleccionarPendiente,
1500
);

}

function comprobar(){
